# Dify health exporter
apiVersion: v1
kind: ConfigMap
metadata:
  name: dify-exporter-v2
  namespace: default
data:
  run.sh: |
    #!/bin/sh
    pip install -q prometheus-client requests 2>/dev/null
    python3 /app/main.py
  main.py: |
    from prometheus_client import start_http_server, Gauge, Histogram, Counter
    import requests, time, os

    API = os.environ.get('DIFY_API', 'http://dify-api.dify.svc.cluster.local:5001')
    WEB = os.environ.get('DIFY_WEB', 'http://dify-web.dify.svc.cluster.local:3000')
    PORT = int(os.environ.get('PORT', '9480'))

    health = Gauge('dify_exporter_up', 'Service health', ['service'])
    latency = Histogram('dify_exporter_latency_sec', 'Check latency', ['service'])
    errors = Counter('dify_exporter_errors', 'Check errors', ['service'])

    start_http_server(PORT)
    print(f'Dify exporter :{PORT}', flush=True)
    while True:
        for name, url in [('api', f'{API}/health'), ('web', f'{WEB}')]:
            try:
                t0 = time.time()
                r = requests.get(url, timeout=10)
                latency.labels(service=name).observe(time.time() - t0)
                health.labels(service=name).set(1 if r.status_code < 500 else 0)
            except Exception:
                health.labels(service=name).set(0)
                errors.labels(service=name).inc()
        time.sleep(30)
