---
# Python-based exporter that scrapes ollama API for per-model metrics
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-exporter-v2
  namespace: default
data:
  run.sh: |
    #!/bin/sh
    pip install -q prometheus-client requests 2>/dev/null
    python3 /app/main.py
  main.py: |
    from prometheus_client import start_http_server, Gauge, Histogram, Counter
    import requests, time, os, sys

    MASTER = os.environ.get('OLLAMA_MASTER', 'http://ollama-master.ai-platform.svc.cluster.local:11434')
    WORKER = os.environ.get('OLLAMA_WORKER', 'http://ollama-worker.ai-platform.svc.cluster.local:11434')
    INTERVAL = int(os.environ.get('INTERVAL', '30'))
    PORT = int(os.environ.get('PORT', '9469'))

    m_avail = Gauge('ollama_model_avail', 'Model availability', ['model', 'source'])
    m_size = Gauge('ollama_model_size_gb', 'Model size GB', ['model', 'source'])
    m_health = Gauge('ollama_api_up', 'API health', ['source'])
    m_latency = Histogram('ollama_api_latency_sec', 'API latency', ['source', 'endpoint'])
    m_errors = Counter('ollama_api_errors', 'API errors', ['source', 'endpoint'])

    def scrape(url, src):
        try:
            t0 = time.time()
            r = requests.get(f'{url}/api/tags', timeout=15)
            m_latency.labels(source=src, endpoint='tags').observe(time.time() - t0)
            if r.status_code == 200:
                m_health.labels(source=src).set(1)
                for mdl in r.json().get('models', []):
                    nm = mdl.get('name', 'unknown')
                    sz = mdl.get('size', 0) / 1e9
                    m_avail.labels(model=nm, source=src).set(1)
                    m_size.labels(model=nm, source=src).set(sz)
            else:
                m_health.labels(source=src).set(0)
                m_errors.labels(source=src, endpoint='tags').inc()
        except Exception as e:
            m_health.labels(source=src).set(0)
            m_errors.labels(source=src, endpoint='tags').inc()

    start_http_server(PORT)
    print(f'Exporter started on :{PORT}', flush=True)
    while True:
        scrape(MASTER, 'master')
        try:
            scrape(WORKER, 'worker')
        except:
            pass
        time.sleep(INTERVAL)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-exporter-python
  namespace: default
  labels:
    app: ollama-exporter-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-exporter-python
  template:
    metadata:
      labels:
        app: ollama-exporter-python
    spec:
      containers:
      - name: exporter
        image: python:3.11-alpine
        command: ["/bin/sh", "/app/run.sh"]
        ports:
        - containerPort: 9469
          name: metrics
        env:
        - name: OLLAMA_MASTER
          value: "http://ollama-master.ai-platform.svc.cluster.local:11434"
        - name: OLLAMA_WORKER
          value: "http://ollama-worker.ai-platform.svc.cluster.local:11434"
        - name: INTERVAL
          value: "30"
        - name: PORT
          value: "9469"
        volumeMounts:
        - mountPath: /app
          name: script
        resources:
          limits: {cpu: 200m, memory: 128Mi}
          requests: {cpu: 50m, memory: 64Mi}
      volumes:
      - name: script
        configMap:
          name: ollama-exporter-v2
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-exporter-python
  namespace: default
  labels:
    app: ollama-exporter-python
spec:
  selector:
    app: ollama-exporter-python
  ports:
  - port: 9469
    targetPort: 9469
    name: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ollama-exporter-python
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ollama-exporter-python
  namespaceSelector:
    matchNames: [default]
  endpoints:
  - port: metrics
    interval: 30s
---
# Litellm health exporter
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-exporter-v2
  namespace: default
data:
  run.sh: |
    #!/bin/sh
    pip install -q prometheus-client requests 2>/dev/null
    python3 /app/main.py
  main.py: |
    from prometheus_client import start_http_server, Gauge, Counter, Histogram
    import requests, time, os

    URL = os.environ.get('LITELLM_URL', 'http://litellm.ai-platform.svc.cluster.local:4000')
    PORT = int(os.environ.get('PORT', '9476'))

    health = Gauge('litellm_gateway_up', 'Gateway health', ['endpoint'])
    latency = Histogram('litellm_check_sec', 'Check latency', ['endpoint'])
    errors = Counter('litellm_check_errors', 'Check errors', ['endpoint'])

    start_http_server(PORT)
    print(f'Litellm exporter :{PORT}', flush=True)
    while True:
        for ep in ['/health', '/health/readiness', '/health/liveliness']:
            try:
                t0 = time.time()
                r = requests.get(f'{URL}{ep}', timeout=10)
                latency.labels(endpoint=ep).observe(time.time() - t0)
                health.labels(endpoint=ep).set(1 if r.status_code < 500 else 0)
            except Exception:
                health.labels(endpoint=ep).set(0)
                errors.labels(endpoint=ep).inc()
        time.sleep(30)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-exporter-python
  namespace: default
  labels:
    app: litellm-exporter-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-exporter-python
  template:
    metadata:
      labels:
        app: litellm-exporter-python
    spec:
      containers:
      - name: exporter
        image: python:3.11-alpine
        command: ["/bin/sh", "/app/run.sh"]
        ports:
        - containerPort: 9476
          name: metrics
        env:
        - name: LITELLM_URL
          value: "http://litellm.ai-platform.svc.cluster.local:4000"
        - name: PORT
          value: "9476"
        volumeMounts:
        - mountPath: /app
          name: script
        resources:
          limits: {cpu: 200m, memory: 128Mi}
          requests: {cpu: 50m, memory: 64Mi}
      volumes:
      - name: script
        configMap:
          name: litellm-exporter-v2
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-exporter-python
  namespace: default
  labels:
    app: litellm-exporter-python
spec:
  selector:
    app: litellm-exporter-python
  ports:
  - port: 9476
    targetPort: 9476
    name: metrics
