---
# 9. Dify-Plus Mail Server
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dify-plus-mail-server
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  endpoints:
    - interval: 30s
      path: /metrics
      port: "8025"
      scheme: http
  namespaceSelector:
    matchNames:
      - dify-plus
  selector:
    matchLabels:
      app: mail-server
---
# 10. Dify namespace services (dify-api, dify-web, dify-worker, dify-plugin-daemon)
# These are in the "dify" namespace (not dify-plus)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dify-ns-api
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  endpoints:
    - interval: 30s
      path: /health
      port: "5001"
      scheme: http
  namespaceSelector:
    matchNames:
      - dify
  selector:
    matchLabels:
      app: dify-api
---
apiVersion: monitoring.coreos.com/v1
