      port: "3000"
      scheme: http
  namespaceSelector:
    matchNames:
      - dify
  selector:
    matchLabels:
      app: dify-web
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dify-ns-worker
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  endpoints:
    - interval: 30s
      path: /health
      port: "5001"
      scheme: http
  namespaceSelector:
    matchNames:
      - dify
  selector:
    matchLabels:
      app: dify-worker
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dify-ns-plugin-daemon
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  endpoints:
    - interval: 30s
      path: /health
      port: "5002"
      scheme: http
  namespaceSelector:
    matchNames:
      - dify
  selector:
    matchLabels:
      app: dify-plugin-daemon