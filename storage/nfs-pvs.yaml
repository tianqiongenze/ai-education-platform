apiVersion: v1
kind: PersistentVolume
metadata:
  name: code-server-nfs-pv
  labels:
    app: code-server
    storage-type: nfs
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-static
  nfs:
    server: 10.167.2.175
    path: /home/k8s-data/nfs/code-server
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: open-webui-nfs-pv
  labels:
    app: open-webui
    storage-type: nfs
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-static
  nfs:
    server: 10.167.2.175
    path: /home/k8s-data/nfs/open-webui