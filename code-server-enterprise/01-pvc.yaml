apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: code-server-data
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi