apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/component: ide
    app.kubernetes.io/part-of: ai-platform
  annotations:
    deployment.kubernetes.io/revision: "1"
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: code-server
      app.kubernetes.io/component: ide
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-server
        app.kubernetes.io/component: ide
        app.kubernetes.io/part-of: ai-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        checksum/config: "GENERATED_BY_KUSTOMIZE"
    spec:
      serviceAccountName: code-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - code-server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: code-server
          image: codercom/code-server:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "/etc/code-server/entrypoint.sh"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: code-server-secrets
                  key: password
            - name: SOPS_AGE_KEY
              valueFrom:
                secretKeyRef:
                  name: code-server-secrets
                  key: sops-age-key
                  optional: true
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /home/coder
            - name: config
              mountPath: /etc/code-server
              readOnly: true
            - name: secrets
              mountPath: /etc/code-server-secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run-user
              mountPath: /run/user/1000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: code-server-data
        - name: config
          configMap:
            name: code-server-config
            defaultMode: 0755
        - name: secrets
          secret:
            secretName: code-server-secrets
            defaultMode: 0400
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: "512Mi"
        - name: run-user
          emptyDir:
            medium: Memory
            sizeLimit: "64Mi"
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: code-server-secrets
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: code-server
    app.kubernetes.io/component: secrets
data:
  password: YWlAMjAyNg==
  sops-age-key: ZHVtbXktc29wcy1rZXk=