general_settings:
  master_key: "sk-ai-platform-master"
  otel: false
  proxy_batch_responses: true
  disable_anthropic_pass_through: true

litellm_settings:
  drop_params: true
  allow_requests_without_api_key: true

router_settings:
  routing_strategy: "latency-based-routing"
  allowed_fails: 3
  num_retries: 2
  fallback_ack: false
  cooldown: 60